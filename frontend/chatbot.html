<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot – Musketeers Mart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Chat window ───────────────────────────────────────────── */
    .chat-window {
      width: 500px;
      height: 600px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #f472b6, #a855f7);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-header-title {
      font-size: 20px;
      font-weight: 700;
      font-style: italic;
      color: white;
      letter-spacing: 0.3px;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-dots {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      gap: 3px;
      align-items: center;
      padding: 4px;
    }

    .btn-dots span {
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      display: block;
    }

    .btn-close {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
    }

    .btn-close:hover { opacity: 0.8; }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }

    /* Message bubbles */
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.bot {
      background: #f3f4f6;
      color: #111827;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: linear-gradient(135deg, #f472b6, #a855f7);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .msg-time.right { text-align: right; align-self: flex-end; }
    .msg-time.left  { align-self: flex-start; }

    /* Typing indicator */
    .typing {
      display: none;
      align-self: flex-start;
      background: #f3f4f6;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 10px 16px;
    }

    .typing.active { display: flex; gap: 5px; align-items: center; }

    .typing span {
      width: 7px; height: 7px;
      background: #a855f7;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* Divider before input */
    .chat-divider {
      height: 1px;
      background: #f3f4f6;
      flex-shrink: 0;
    }

    /* Input row */
    .chat-input-row {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
      color: #111827;
      background: #fafafa;
    }

    .chat-input::placeholder { color: #9ca3af; }

    .chat-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }

    .btn-send {
      width: 36px; height: 36px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #a855f7);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .btn-send:hover { opacity: 0.85; }

    /* Back button (shown when opened as standalone page) */
    .back-bar {
      position: fixed;
      top: 16px;
      left: 16px;
    }

    .btn-back {
      padding: 8px 16px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-back:hover { background: #374151; }
  </style>
</head>
<body>

  <!-- Back button for standalone navigation -->
  <div class="back-bar">
    <button class="btn-back" onclick="goBack()">← Back</button>
  </div>

  <div class="chat-window" id="chatWindow">

    <!-- Header -->
    <div class="chat-header">
      <span class="chat-header-title">Chat with us</span>
      <div class="chat-header-actions">
        <button class="btn-dots" title="Options">
          <span></span><span></span><span></span>
        </button>
        <button class="btn-close" onclick="goBack()" title="Close">×</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot">👋 Hi! I'm the Musketeers Mart assistant. How can I help you today?</div>
      <div class="msg-time left">Just now</div>
      <div class="typing" id="typingIndicator">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chat-divider"></div>

    <!-- Input -->
    <div class="chat-input-row">
      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Type a message..."
        autocomplete="off"
      />
      <button class="btn-send" id="sendBtn" title="Send">&#9658;</button>
    </div>

  </div>

  <script>
    /* ── Navigation ────────────────────────────────────────────── */
    function goBack() {
      if (document.referrer) {
        history.back();
      } else {
        window.location.href = "MainPage.html";
      }
    }

    /* ── Helpers ───────────────────────────────────────────────── */
    const messagesEl  = document.getElementById("chatMessages");
    const inputEl     = document.getElementById("chatInput");
    const typingEl    = document.getElementById("typingIndicator");

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMsg(text, role) {
      const bubble = document.createElement("div");
      bubble.className = `msg ${role}`;
      bubble.textContent = text;

      const time = document.createElement("div");
      time.className = `msg-time ${role === "user" ? "right" : "left"}`;
      time.textContent = timeNow();

      // Insert before the typing indicator
      messagesEl.insertBefore(bubble, typingEl);
      messagesEl.insertBefore(time, typingEl);
      scrollBottom();
    }

    function showTyping()  { typingEl.classList.add("active");    scrollBottom(); }
    function hideTyping()  { typingEl.classList.remove("active"); }

    /* ── Placeholder bot responses ─────────────────────────────── */
    const botReplies = [
      "I'm still learning! A human agent will follow up shortly.",
      "Great question. Let me check on that for you.",
      "Thanks for reaching out! Our team will get back to you soon.",
      "I've noted your message. Is there anything else I can help with?",
      "Sure thing! Can you provide a bit more detail?",
    ];

    let replyIndex = 0;

    function botReply() {
      showTyping();
      setTimeout(() => {
        hideTyping();
        appendMsg(botReplies[replyIndex % botReplies.length], "bot");
        replyIndex++;
      }, 1200);
    }

    /* ── Send ──────────────────────────────────────────────────── */
    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      appendMsg(text, "user");
      inputEl.value = "";
      botReply();
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
