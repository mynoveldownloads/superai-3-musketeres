<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot – Musketeers Mart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body {
      min-height: 100vh;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Chat window ───────────────────────────────────────────── */
    .chat-window {
      width: 500px;
      height: 600px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #f472b6, #a855f7);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-header-title {
      font-size: 20px;
      font-weight: 700;
      font-style: italic;
      color: white;
      letter-spacing: 0.3px;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-dots {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      gap: 3px;
      align-items: center;
      padding: 4px;
    }

    .btn-dots span {
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      display: block;
    }

    .btn-close {
      background: none;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
    }

    .btn-close:hover { opacity: 0.8; }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }

    /* Message bubbles */
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.bot {
      background: #f3f4f6;
      color: #111827;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: linear-gradient(135deg, #f472b6, #a855f7);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Chart image rendered inside bot bubble */
    .msg img.chart-img {
      display: block;
      max-width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    .msg-time {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .msg-time.right { text-align: right; align-self: flex-end; }
    .msg-time.left  { align-self: flex-start; }

    /* Typing indicator */
    .typing {
      display: none;
      align-self: flex-start;
      background: #f3f4f6;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 10px 16px;
    }

    .typing.active { display: flex; gap: 5px; align-items: center; }

    .typing span {
      width: 7px; height: 7px;
      background: #a855f7;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* Divider before input */
    .chat-divider {
      height: 1px;
      background: #f3f4f6;
      flex-shrink: 0;
    }

    /* Input row */
    .chat-input-row {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
      color: #111827;
      background: #fafafa;
    }

    .chat-input::placeholder { color: #9ca3af; }

    .chat-input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }

    .btn-send {
      width: 36px; height: 36px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #a855f7);
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    .btn-send:hover { opacity: 0.85; }

    /* Back button (shown when opened as standalone page) */
    .back-bar {
      position: fixed;
      top: 16px;
      left: 16px;
    }

    .btn-back {
      padding: 8px 16px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-back:hover { background: #374151; }
  </style>
</head>
<body>

  <!-- Back button for standalone navigation -->
  <div class="back-bar">
    <button class="btn-back" onclick="goBack()">← Back</button>
  </div>

  <div class="chat-window" id="chatWindow">

    <!-- Header -->
    <div class="chat-header">
      <span class="chat-header-title">Chat with us</span>
      <div class="chat-header-actions">
        <button class="btn-dots" title="Options">
          <span></span><span></span><span></span>
        </button>
        <button class="btn-close" onclick="goBack()" title="Close">×</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot">👋 Hi! I'm the Musketeers Mart assistant. How can I help you today?</div>
      <div class="msg-time left">Just now</div>
      <div class="typing" id="typingIndicator">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="chat-divider"></div>

    <!-- Input -->
    <div class="chat-input-row">
      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Type a message..."
        autocomplete="off"
      />
      <button class="btn-send" id="sendBtn" title="Send">&#9658;</button>
    </div>

  </div>

  <script>
    /* ── Config ────────────────────────────────────────────────── */
    const AGENT_URL  = "https://musketeer-mart.localhost.rodeo/api/agent/chat";
    const SESSION_ID = crypto.randomUUID(); // fresh session each page load

    /* ── Navigation ────────────────────────────────────────────── */
    function goBack() {
      if (document.referrer) history.back();
      else window.location.href = "MainPage.html";
    }

    /* ── DOM refs ──────────────────────────────────────────────── */
    const messagesEl = document.getElementById("chatMessages");
    const inputEl    = document.getElementById("chatInput");
    const typingEl   = document.getElementById("typingIndicator");

    /* ── Helpers ───────────────────────────────────────────────── */
    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    /** Convert basic markdown to HTML (bold, italic, bullet lines) */
    function renderMarkdown(text) {
      return text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") // escape HTML
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")   // **bold**
        .replace(/\*(.+?)\*/g, "<em>$1</em>")               // *italic*
        .replace(/^[•\-\*] (.+)$/gm, "<li>$1</li>")         // bullet lines
        .replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>")          // wrap bullets
        .replace(/\n/g, "<br>");                             // newlines
    }

    /**
     * Append a message bubble + optional chart image below it.
     * Text and image are separate DOM elements so neither blocks the other.
     */
    function appendMsg(text, role, imageUrl = null) {
      // Text bubble
      const bubble = document.createElement("div");
      bubble.className = `msg ${role}`;
      if (role === "bot") {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }
      messagesEl.insertBefore(bubble, typingEl);

      // Chart image — rendered as its own element directly below the bubble
      if (imageUrl) {
        const imgWrap = document.createElement("div");
        imgWrap.style.cssText = "align-self:flex-start;max-width:90%;margin-top:4px;";

        const img = document.createElement("img");
        img.src   = imageUrl;
        img.alt   = "Chart";
        img.style.cssText = "max-width:100%;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.12);display:block;";
        img.onerror = () => {
          imgWrap.innerHTML = "<span style='color:#ef4444;font-size:12px;'>⚠️ Chart could not be loaded</span>";
        };

        imgWrap.appendChild(img);
        messagesEl.insertBefore(imgWrap, typingEl);
      }

      // Timestamp
      const time = document.createElement("div");
      time.className   = `msg-time ${role === "user" ? "right" : "left"}`;
      time.textContent = timeNow();
      messagesEl.insertBefore(time, typingEl);

      scrollBottom();
    }

    function showTyping() { typingEl.classList.add("active");    scrollBottom(); }
    function hideTyping() { typingEl.classList.remove("active"); }

    /** Render base64 PNG string as an <img> element inserted into the chat */
    function renderChart(base64String) {
      const imgWrap = document.createElement("div");
      imgWrap.style.cssText = "align-self:flex-start;max-width:95%;margin-top:6px;";

      const img = document.createElement("img");
      // base64 may already include the data URI prefix — handle both
      img.src = base64String.startsWith("data:")
        ? base64String
        : `data:image/png;base64,${base64String}`;
      img.alt   = "Chart";
      img.style.cssText = "max-width:100%;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,0.14);display:block;";
      img.onerror = () => {
        imgWrap.innerHTML = "<span style='color:#ef4444;font-size:12px;padding:6px;display:block;'>⚠️ Chart could not be rendered</span>";
      };

      imgWrap.appendChild(img);
      messagesEl.insertBefore(imgWrap, typingEl);
      scrollBottom();
    }

    /* ── Send message → POST /chat ─────────────────────────────── */
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      appendMsg(text, "user");
      inputEl.value = "";
      showTyping();

      try {
        const resp = await fetch(AGENT_URL, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ session_id: SESSION_ID, message: text }),
        });

        if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

        const data = await resp.json();
        hideTyping();

        // Debug: show whether base64 was received
        const hasBase64 = data.base64 ? `✅ base64 received (${data.base64.length} chars)` : "❌ no base64 in response";
        console.log("Agent response:", data);
        console.log(hasBase64);

        // 1. Show text response + debug indicator
        appendMsg(data.response + "\n\n[" + hasBase64 + "]", "bot");

        // 2. If base64 is present, decode and render chart image below the text
        if (data.base64) {
          renderChart(data.base64);
        } else if (data.image_url) {
          // fallback: render via URL
          renderChart(data.image_url);
        }

        // 3. If recommendation exists, show a "Place Order" button
        if (data.recommendation && data.recommendation.product_name) {
          const rec = data.recommendation;
          const params = new URLSearchParams({
            supplier: rec.supplier_name || "",
            product:  rec.product_name  || "",
            qty:      rec.qty || 1
          });
          const btnWrap = document.createElement("div");
          btnWrap.style.cssText = "align-self:flex-start;margin-top:8px;";
          btnWrap.innerHTML = `
            <button onclick="window.location.href='OrderForm.html?${params.toString()}'"
              style="background:linear-gradient(135deg,#16a34a,#15803d);color:white;border:none;
              padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;">
              📋 Place Order → ${rec.product_name} (${rec.qty} units)
            </button>
          `;
          messagesEl.insertBefore(btnWrap, typingEl);
          scrollBottom();
        }

      } catch (err) {
        hideTyping();
        appendMsg("⚠️ Could not reach the AI agent. Make sure the server is running on port 5000.", "bot");
        console.error("Agent fetch error:", err);
      }
    }

    /* ── Event listeners ───────────────────────────────────────── */
    document.getElementById("sendBtn").addEventListener("click", () => sendMessage());
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
