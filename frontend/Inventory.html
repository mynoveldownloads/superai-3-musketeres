<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musketeers Mart - Inventory Management</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f3f4f6;
      overflow-x: hidden;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 300px;
      background: #111827;
      color: white;
      padding: 20px 18px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .sidebar h2 {
      font-size: 22px;
    }

    .close-btn {
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
    }

    .sidebar a.menu-link {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.06);
    }

    .sidebar a.menu-link:hover {
      background: rgba(255,255,255,0.15);
    }

    .sidebar-profile {
      margin-top: auto;
      padding: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      border: 2px solid #16a34a;
      flex-shrink: 0;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .username {
      font-size: 13px;
      font-weight: 700;
      color: white;
      line-height: 1.2;
    }

    .view-profile {
      font-size: 12px;
      font-weight: 600;
      color: #16a34a;
      text-decoration: none;
    }

    .main {
      width: 100%;
      padding: 24px;
      margin-left: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .toggle-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    .page-title {
      font-size: 30px;
      font-weight: 700;
      color: #111827;
    }

    .filter-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 8px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .field input:focus,
    .field select:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,.15);
    }

    .table-card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .table-header {
      padding: 20px 22px 10px;
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #111827;
      color: white;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    .status-pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #e5f6ec;
      color: #15803d;
      font-size: 12px;
      font-weight: 700;
    }

    .chat-bubble {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #16a34a;
      color: white;
      border-radius: 999px;
      padding: 14px 18px;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      cursor: pointer;
      z-index: 1100;
      max-width: 230px;
    }

    .chat-bubble::after {
      content: "";
      position: absolute;
      right: 24px;
      bottom: -8px;
      border-width: 8px 8px 0 8px;
      border-style: solid;
      border-color: #16a34a transparent transparent transparent;
    }

    .chat-bubble span {
      display: block;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .filter-row {
        grid-template-columns: 1fr;
      }

      table {
        min-width: 700px;
      }

      .table-card {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="sidebar-header">
          <h2>Musketeers Mart</h2>
          <button class="close-btn" id="closeBtn">×</button>
        </div>

        <a href="MainPage.html" class="menu-link">Dashboard</a>
        <a href="#" class="menu-link">Order History</a>
        <a href="inventory.html" class="menu-link">Inventory Management</a>
        <a href="#" class="menu-link">Order Form</a>
      </div>

      <div class="sidebar-profile">
        <img src="profile_pic_default.png" alt="User Profile">
        <div class="profile-info">
          <div class="username" id="sidebarUsername">user1</div>
          <a href="#" class="view-profile" id="viewProfileLink">View Profile</a>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="toggle-btn" id="toggleBtn">☰</button>
        <div class="page-title">Products</div>
      </div>

      <div class="filter-card">
        <div class="filter-row">
          <div class="field">
            <label for="searchProduct">Search</label>
            <input type="text" id="searchProduct" placeholder="Search product info">
          </div>

          <div class="field">
            <label for="brandFilter">Brand Name</label>
            <select id="brandFilter">
              <option value="">All Brands</option>
              <option value="brand1">Brand 1</option>
              <option value="brand2">Brand 2</option>
            </select>
          </div>

          <div class="field">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
              <option value="">All Categories</option>
              <option value="dairy">Dairy</option>
              <option value="produce">Produce</option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header">Product List</div>
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Category</th>
              <th>Brand Name</th>
              <th>Base Retail Price</th>
              <th>Quantity On Hand</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Placeholder Product</td>
              <td>Dairy</td>
              <td>Brand 1</td>
              <td>$0.00</td>
              <td>0</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="chat-bubble" id="chatBubble">
    <span>Hi, do you need any help?</span>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleBtn");
    const closeBtn = document.getElementById("closeBtn");
    const chatBubble = document.getElementById("chatBubble");
    const sidebarUsername = document.getElementById("sidebarUsername");
    const viewProfileLink = document.getElementById("viewProfileLink");

    const username = localStorage.getItem("currentUser") || "user1";
    sidebarUsername.textContent = username;

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.add("open");
    });

    closeBtn.addEventListener("click", () => {
      sidebar.classList.remove("open");
    });

    viewProfileLink.addEventListener("click", (e) => {
      e.preventDefault();
      alert("View Profile for " + username);
    });

    chatBubble.addEventListener("click", () => {
      alert("AI bot will be connected here later.");
    });
  </script>
</body>
</html>
