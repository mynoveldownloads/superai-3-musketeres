<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(15,23,42,.55), rgba(15,23,42,.55)),
        url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.96);
      border-radius: 18px;
      padding: 34px 30px;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
      border: 1px solid #dbe4ff;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      text-align: center;
      margin-bottom: 22px;
      color: #4b5563;
      font-size: 14px;
    }

    p a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    p a:hover {
      text-decoration: underline;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    button:hover {
      background: #2563eb;
    }

    .msg {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .ok {
      color: #15803d;
    }

    .bad {
      color: #dc2626;
    }

    .back-btn {
      display: none;
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #1f2937;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot password?</h1>
    <p>Remember your password? <a href="index.html">Login here</a></p>

    <form id="resetForm">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <button type="submit">Reset password</button>
    </form>

    <div id="message" class="msg"></div>
    <button id="backBtn" class="back-btn">Back to homepage</button>
  </div>

  <script>
    const resetForm = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const backBtn = document.getElementById("backBtn");

    resetForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();

      if (email) {
        message.textContent = "Reset password successful!";
        message.className = "msg ok";
        backBtn.style.display = "block";
        resetForm.reset();
      } else {
        message.textContent = "Please enter your email address.";
        message.className = "msg bad";
        backBtn.style.display = "none";
      }
    });

    backBtn.addEventListener("click", function() {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
